spring.application.name=springao
# Enable the H2 console
spring.h2.console.enabled=true

# Set the path to access it (this is the default, but good to be explicit)
spring.h2.console.path=/h2-console

# Define the database URL, username, and password so you know exactly what to type in the console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password